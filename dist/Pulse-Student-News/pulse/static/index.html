<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Pulse — Student News</title>
<meta name="description" content="Pulse is a personalised news app for students and teens: 300+ sources, live scores, AI overviews and a permanent searchable archive.">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-v20.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v20.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7fb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0c11">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div id="boot" class="boot" aria-hidden="true">
  <div class="boot__mark" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <p class="boot__text">Waking up your feed…</p>
</div>

<div id="shell" class="shell" hidden>
  <header class="appbar" id="appbar">
    <div class="appbar__inner">
      <a class="brand" href="/" data-link aria-label="Pulse home">
        <span class="brand__pulse" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span class="brand__name">Pulse</span>
      </a>

      <nav class="appnav" id="nav" aria-label="Primary"></nav>

      <div class="appbar__right">
        <button class="appbar__search" id="nav-search" type="button" aria-label="Search news">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search</span><kbd class="kbd">⌘K</kbd>
        </button>
        <button class="icon-btn" id="theme-btn" aria-label="Switch theme" title="Theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button class="icon-btn" id="legend-btn" aria-label="Reading key" title="Reading key">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </button>
        <button class="icon-btn" id="breaking-btn" aria-label="Breaking news" hidden></button>
        <button class="icon-btn" id="install-btn" aria-label="Install app" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        </button>
        <a class="avatar" id="avatar" href="/profile" data-link aria-label="Your profile">?</a>
      </div>
    </div>
  </header>

  <main class="main" id="main" tabindex="-1">
    <div id="view" class="view"></div>
  </main>

  <footer class="site-footer" id="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__brand">
        <b>Pulse</b>
        <span>A local-first news reader for students. No ads, no trackers, no account required.</span>
      </div>
      <nav class="site-footer__links" aria-label="Project">
        <a href="/about" data-link>About the project</a>
        <a href="/impact" data-link>Impact</a>
        <a href="/videos" data-link>Videos</a>
        <a href="/classroom" data-link>Classroom</a>
        <a href="/arcade" data-link>Arcade</a>
        <a href="/roadmap" data-link>Roadmap &amp; feedback</a>
        <a href="/privacy" data-link>Privacy</a>
        <a href="/terms" data-link>Terms</a>
      </nav>
    </div>
  </footer>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Primary mobile"></nav>
</div>
</div>

<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
<div id="modal-root" class="modal-root" hidden></div>
<div id="selection-menu" class="selection-menu" hidden></div>

<noscript>
  <div class="noscript">Pulse needs JavaScript for its reader, search and personalisation. The archive itself is a plain SQLite file you own.</div>
</noscript>

<script type="module" src="/js/app.js"></script>
</body>
</html>
